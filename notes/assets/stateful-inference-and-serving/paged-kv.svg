<text x="550" y="149" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">有效：5 + 9 = 14 槽；已分配：(2 + 3) × 4 = 20 槽</text>
<text x="44" y="230" font-size="27" font-weight="600" fill="#172033" text-anchor="start">A：5 个 token</text>
