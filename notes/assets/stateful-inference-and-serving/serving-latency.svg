<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830" viewBox="0 0 1100 830" role="img" aria-labelledby="title desc">
<title id="title">用户等待时间，不等于模型计算时间</title><desc id="desc">教学假设时间线，非实测。客户端 0 ms 发请求，120 ms 收首 token，150 ms 和 195 ms 收到随后两个 token。因此 TTFT 为 120 ms，两个 ITL 为 30 ms 和 45 ms。模型 decode 分别只发生于 135 至 140 ms、180 至 185 ms，均为 5 ms。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  <marker id="arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
  <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/></marker>
  <pattern id="unused" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#fff"/><path d="M-2 2 L2 -2 M0 9 L9 0 M7 11 L11 7" stroke="#94a3b8" stroke-width="1.3"/></pattern>
</defs>
<rect width="1100" height="830" fill="#ffffff"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#172033">
<text x="44" y="53" font-size="34" font-weight="600" fill="#172033" text-anchor="start">用户等待时间，不等于模型计算时间</text>
<text x="44" y="91" font-size="24" font-weight="400" fill="#475569" text-anchor="start">教学假设，非实测；上下两行使用同一条时间尺度。</text>
<path d="M 104.0 191 V 181 H 650.0 V 191" fill="none" stroke="#475569" stroke-width="2"/>
<text x="377.0" y="168" font-size="24" font-weight="600" fill="#172033" text-anchor="middle">TTFT = 120 ms</text>
<path d="M 650.0 253 V 243 H 786.5 V 253" fill="none" stroke="#475569" stroke-width="2"/>
<text x="718.25" y="230" font-size="24" font-weight="600" fill="#172033" text-anchor="middle">ITL = 30 ms</text>
<path d="M 786.5 191 V 181 H 991.25 V 191" fill="none" stroke="#475569" stroke-width="2"/>
<text x="888.875" y="168" font-size="24" font-weight="600" fill="#172033" text-anchor="middle">ITL = 45 ms</text>
<text x="44" y="291" font-size="26" font-weight="600" fill="#172033" text-anchor="start">客户端收到输出</text>
<path d="M 104.0 330 L 1014.0 330" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="104.0" cy="330" r="6" fill="#172033"/>
<text x="104.0" y="368" font-size="24" font-weight="600" fill="#172033" text-anchor="start">0 ms</text>
<text x="104.0" y="401" font-size="23" font-weight="400" fill="#475569" text-anchor="start">发出请求</text>
<path d="M 650.0 424 L 650.0 531" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="650.0" cy="330" r="6" fill="#172033"/>
<text x="650.0" y="368" font-size="24" font-weight="600" fill="#172033" text-anchor="middle">120 ms</text>
<text x="650.0" y="401" font-size="23" font-weight="400" fill="#475569" text-anchor="middle">首 token</text>
<path d="M 786.5 424 L 786.5 531" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="786.5" cy="330" r="6" fill="#172033"/>
<text x="786.5" y="368" font-size="24" font-weight="600" fill="#172033" text-anchor="middle">150 ms</text>
<text x="786.5" y="401" font-size="23" font-weight="400" fill="#475569" text-anchor="middle">第 2 个</text>
<path d="M 991.25 424 L 991.25 531" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="991.25" cy="330" r="6" fill="#172033"/>
<text x="991.25" y="368" font-size="24" font-weight="600" fill="#172033" text-anchor="middle">195 ms</text>
<text x="991.25" y="401" font-size="23" font-weight="400" fill="#475569" text-anchor="middle">第 3 个</text>
<text x="44" y="457" font-size="26" font-weight="600" fill="#172033" text-anchor="start">模型 decode</text>
<path d="M 104.0 515 L 1014.0 515" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<rect x="718.25" y="494" width="22.75" height="42" rx="1" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<rect x="923.0" y="494" width="22.75" height="42" rx="1" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<path d="M 729.625 537 V 564 H 684 V 585" fill="none" stroke="#0d9488" stroke-width="2"/>
<path d="M 934.375 537 V 585" fill="none" stroke="#0d9488" stroke-width="2"/>
<rect x="573" y="585" width="225" height="95" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="685.5" y="624" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">135–140 ms</text>
<text x="685.5" y="660" font-size="24" font-weight="400" fill="#172033" text-anchor="middle">decode：5 ms</text>
<rect x="828" y="585" width="228" height="95" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="942" y="624" font-size="25" font-weight="600" fill="#172033" text-anchor="middle">180–185 ms</text>
<text x="942" y="660" font-size="24" font-weight="400" fill="#172033" text-anchor="middle">decode：5 ms</text>
<rect x="44" y="713" width="1012" height="86" rx="10" fill="#f1f5f9" stroke="#f1f5f9" stroke-width="1.5"/>
<text x="65" y="748" font-size="24" font-weight="600" fill="#172033" text-anchor="start">两次模型 decode 都是 5 ms，用户看到的间隔却是 30 ms、45 ms。</text>
<text x="65" y="783" font-size="22" font-weight="400" fill="#475569" text-anchor="start">其余时间可能用于等待、输出处理、传输；首 token 前的内部阶段未展开。</text>
</g></svg>
