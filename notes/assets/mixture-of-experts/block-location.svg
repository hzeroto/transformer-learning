<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1175" viewBox="0 0 1050 1175" role="img" aria-labelledby="title description"><title id="title">MoE 放在哪里：替换这一层的 FFN</title><desc id="description">LLaMA 风格的 Pre-Norm 层：输入 X 经过 RMSNorm 和因果 Attention 后与 X 相加得到 H；H 经过 RMSNorm 得到 Z，Z 经 MoE 后与 H 相加。MoE 内部为每个 token 选择专家、运行完整专家 FFN 并加权相加。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker></defs><rect width="1050" height="1175" fill="white"/><g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" fill="#172b40"><text x="32" y="47" font-size="28" font-weight="600">MoE 放在哪里：替换这一层的 FFN</text><text x="32" y="85" font-size="20" >单层 LLaMA 风格 Pre-Norm；B = batch，T = token 数，C = 隐藏宽度。</text><rect x="32" y="106" width="986" height="520" rx="9" fill="#f8fafc" stroke="#c8d3df" /><text x="515" y="140" font-size="22" text-anchor="middle" font-weight="600">输入 X：(B, T, C)</text><path d="M515 150 V166" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><path d="M515 150 H175 V317 H491" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><text x="90" y="242" font-size="20" fill="#526477">保留 X</text><rect x="360" y="168" width="310" height="43" rx="9" fill="white" stroke="#c8d3df" /><text x="515" y="197" font-size="21" text-anchor="middle" >RMSNorm</text><path d="M515 211 V232" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><rect x="360" y="234" width="310" height="51" rx="9" fill="#dcecf9" stroke="#c8d3df" /><text x="515" y="267" font-size="22" text-anchor="middle" >因果 Attention</text><path d="M515 285 V293" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><circle cx="515" cy="317" r="23" fill="white" stroke="#526477" stroke-width="2"/><text x="515" y="325" font-size="29" text-anchor="middle" >+</text><text x="567" y="323" font-size="20" >H = X + Attention(RMSNorm(X))</text><path d="M515 340 V369" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><path d="M515 350 H883 V537 H539" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><text x="900" y="444" font-size="20" fill="#526477">保留 H</text><rect x="360" y="371" width="310" height="43" rx="9" fill="white" stroke="#c8d3df" /><text x="515" y="400" font-size="21" text-anchor="middle" >RMSNorm</text><path d="M515 414 V450" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><text x="551" y="440" font-size="20" fill="#17639b">Z：(B, T, C)</text><rect x="360" y="452" width="310" height="51" rx="9" fill="#f0e7f6" stroke="#8650aa" /><text x="515" y="485" font-size="21" text-anchor="middle" >MoE：替换原 SwiGLU FFN</text><path d="M515 503 V513" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><circle cx="515" cy="537" r="23" fill="white" stroke="#526477" stroke-width="2"/><text x="515" y="545" font-size="29" text-anchor="middle" >+</text><path d="M515 560 V581" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><text x="515" y="609" font-size="22" text-anchor="middle" font-weight="600">本层输出 = H + MoE(Z)；shape 仍为 (B, T, C)</text><text x="62" y="589" font-size="18" fill="#526477">⊕ 表示逐元素相加</text><text x="32" y="664" font-size="23" font-weight="600">放大 MoE：下面只看 Z 中的一行向量 z，shape 为 (C,)。</text><text x="32" y="698" font-size="20" >示意：3 个独立专家，当前 token 只选择专家 0 和 2；每个专家都是完整 FFN。</text><rect x="32" y="725" width="986" height="340" rx="9" fill="#fbf9fd" stroke="#c8d3df" /><text x="92" y="900" font-size="27" text-anchor="middle" font-weight="600">z</text><path d="M113 890 H177" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><rect x="180" y="812" width="220" height="152" rx="9" fill="white" stroke="#8650aa" /><text x="290" y="850" font-size="22" text-anchor="middle" font-weight="600">Router（路由器）</text><text x="290" y="885" font-size="20" text-anchor="middle" >计算专家分数</text><text x="290" y="918" font-size="20" text-anchor="middle" >选编号 0、2</text><text x="290" y="949" font-size="19" text-anchor="middle" >得到权重 w₀、w₂</text><path d="M290 812 V766 H900 V810" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="615" y="754" font-size="19" text-anchor="middle" fill="#8650aa">所选专家的权重 w₀、w₂</text><path d="M400 850 H459 V834 H503" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><path d="M459 850 V973 H503" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><text x="411" y="1027" font-size="19" fill="#526477">复制整条 z</text><rect x="506" y="805" width="226" height="58" rx="9" fill="#dcecf9" stroke="#c8d3df" /><text x="619" y="842" font-size="21" text-anchor="middle" >专家 0：F₀(z)</text><rect x="506" y="876" width="226" height="52" rx="9" fill="#f1f4f7" stroke="#c8d3df" /><text x="619" y="909" font-size="18" text-anchor="middle" fill="#526477">专家 1：此 token 不运行</text><rect x="506" y="944" width="226" height="58" rx="9" fill="#e7f2eb" stroke="#c8d3df" /><text x="619" y="981" font-size="21" text-anchor="middle" >专家 2：F₂(z)</text><path d="M732 834 H763 V858 H795" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><path d="M732 973 H763 V922 H795" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)" /><rect x="798" y="812" width="203" height="154" rx="9" fill="white" stroke="#8650aa" /><text x="899" y="850" font-size="23" text-anchor="middle" font-weight="600">加权相加</text><text x="899" y="887" font-size="23" text-anchor="middle" >w₀F₀(z)</text><text x="899" y="919" font-size="23" text-anchor="middle" >+ w₂F₂(z)</text><text x="899" y="950" font-size="19" text-anchor="middle" >输出：(C,)</text><text x="32" y="1110" font-size="20" >稀疏的是“每个 token 只运行少数专家”；Attention 的可见范围由自己的 mask 决定。</text><text x="32" y="1146" font-size="20" fill="#526477">所有专家参数仍属于模型；上图展示的是这个 token 本次实际经过的计算路径。</text></g></svg>