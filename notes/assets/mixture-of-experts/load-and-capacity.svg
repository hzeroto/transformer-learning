<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1060" viewBox="0 0 1050 1060" role="img" aria-labelledby="title description"><title id="title">为什么需要关心负载：同样 8 次分配，可以很不均匀</title><desc id="description">独立的 N=8、E=4、k=1 例子。均衡时每个专家各收到2个token；拥堵时8个token都选择专家0，其余专家空闲。每个专家容量3，拥堵时仅专家0超出5次分配；总空位不能自动承接，是否丢弃、改派或等待由具体策略决定。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker></defs><rect width="1050" height="1060" fill="white"/><g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" fill="#172b40"><text x="32" y="47" font-size="28" font-weight="600">为什么需要关心负载：同样 8 次分配，可以很不均匀</text><text x="32" y="86" font-size="20" >独立例子：N = 8 个 token，E = 4 个专家，每个 token 只选 1 个专家（k = 1）。</text><text x="32" y="121" font-size="20" >先看 Router 想把 token 分给谁；虚线是假设的每个专家容量 Ccap = 3。</text><rect x="32" y="151" width="472" height="507" rx="9" fill="#fafbfd" stroke="#c8d3df" /><text x="54" y="188" font-size="23" font-weight="600">A. 均衡：每位专家收到 2 个</text><text x="54" y="221" font-size="18" fill="#526477">纵轴：分给各专家的 token 数</text><path d="M87 546 H479" fill="none" stroke="#526477" stroke-width="2" /><text x="63" y="553" font-size="17" fill="#526477">0</text><path d="M87 510 H479" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="63" y="517" font-size="17" fill="#526477">1</text><path d="M87 474 H479" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="63" y="481" font-size="17" fill="#526477">2</text><path d="M87 438 H479" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="63" y="445" font-size="17" fill="#526477">3</text><path d="M87 402 H479" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="63" y="409" font-size="17" fill="#526477">4</text><path d="M87 366 H479" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="63" y="373" font-size="17" fill="#526477">5</text><path d="M87 330 H479" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="63" y="337" font-size="17" fill="#526477">6</text><path d="M87 294 H479" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="63" y="301" font-size="17" fill="#526477">7</text><path d="M87 258 H479" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="63" y="265" font-size="17" fill="#526477">8</text><rect x="112" y="474" width="49" height="72" fill="#17639b"/><text x="136.5" y="462" font-size="22" text-anchor="middle" font-weight="600">2</text><text x="136.5" y="582" font-size="22" text-anchor="middle" >E₀</text><rect x="205" y="474" width="49" height="72" fill="#17639b"/><text x="229.5" y="462" font-size="22" text-anchor="middle" font-weight="600">2</text><text x="229.5" y="582" font-size="22" text-anchor="middle" >E₁</text><rect x="298" y="474" width="49" height="72" fill="#17639b"/><text x="322.5" y="462" font-size="22" text-anchor="middle" font-weight="600">2</text><text x="322.5" y="582" font-size="22" text-anchor="middle" >E₂</text><rect x="391" y="474" width="49" height="72" fill="#17639b"/><text x="415.5" y="462" font-size="22" text-anchor="middle" font-weight="600">2</text><text x="415.5" y="582" font-size="22" text-anchor="middle" >E₃</text><path d="M87 438 H479" fill="none" stroke="#8650aa" stroke-width="2" stroke-dasharray="8 5"/><text x="207" y="426" font-size="18" fill="#8650aa">每位专家容量 = 3</text><text x="54" y="625" font-size="20" >分配数：[2, 2, 2, 2]；总计 8</text><rect x="546" y="151" width="472" height="507" rx="9" fill="#fafbfd" stroke="#c8d3df" /><text x="568" y="188" font-size="23" font-weight="600">B. 拥堵：全部选择专家 0</text><text x="568" y="221" font-size="18" fill="#526477">纵轴：分给各专家的 token 数</text><path d="M601 546 H993" fill="none" stroke="#526477" stroke-width="2" /><text x="577" y="553" font-size="17" fill="#526477">0</text><path d="M601 510 H993" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="577" y="517" font-size="17" fill="#526477">1</text><path d="M601 474 H993" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="577" y="481" font-size="17" fill="#526477">2</text><path d="M601 438 H993" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="577" y="445" font-size="17" fill="#526477">3</text><path d="M601 402 H993" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="577" y="409" font-size="17" fill="#526477">4</text><path d="M601 366 H993" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="577" y="373" font-size="17" fill="#526477">5</text><path d="M601 330 H993" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="577" y="337" font-size="17" fill="#526477">6</text><path d="M601 294 H993" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="577" y="301" font-size="17" fill="#526477">7</text><path d="M601 258 H993" fill="none" stroke="#e6ebf1" stroke-width="2" /><text x="577" y="265" font-size="17" fill="#526477">8</text><rect x="626" y="438" width="49" height="108" fill="#17639b"/><rect x="626" y="258" width="49" height="180" fill="#edb081" stroke="#b75519"/><text x="650.5" y="246" font-size="22" text-anchor="middle" font-weight="600">8</text><text x="650.5" y="582" font-size="22" text-anchor="middle" >E₀</text><text x="743.5" y="534" font-size="22" text-anchor="middle" font-weight="600">0</text><text x="743.5" y="582" font-size="22" text-anchor="middle" >E₁</text><text x="836.5" y="534" font-size="22" text-anchor="middle" font-weight="600">0</text><text x="836.5" y="582" font-size="22" text-anchor="middle" >E₂</text><text x="929.5" y="534" font-size="22" text-anchor="middle" font-weight="600">0</text><text x="929.5" y="582" font-size="22" text-anchor="middle" >E₃</text><path d="M601 438 H993" fill="none" stroke="#8650aa" stroke-width="2" stroke-dasharray="8 5"/><text x="721" y="426" font-size="18" fill="#8650aa">每位专家容量 = 3</text><text x="568" y="625" font-size="20" >分配数：[8, 0, 0, 0]；总计 8</text><rect x="32" y="687" width="986" height="116" rx="9" fill="#fff5ec" stroke="#dfb993" /><text x="55" y="727" font-size="23" font-weight="600">橙色 5 格 = 专家 0 超出的 5 次分配。</text><text x="55" y="764" font-size="21" >其余 3 位专家虽然空闲，也不会自动接走它们；处理方式需要另行定义。</text><text x="32" y="852" font-size="20" >如果设置硬容量：每位专家最多接收 3 次分配；它不是“整个 batch 只留 3 个 token”。</text><text x="32" y="891" font-size="21" >本图只标出溢出位置；丢弃该分支、改派或等待，是不同的实现策略。</text><text x="32" y="944" font-size="21" >不设置硬容量：专家 0 可以继续处理全部 8 个，但计算任务集中在它身上。</text><text x="32" y="983" font-size="21" >这说明了负载均衡的目的：减少专家长期拥堵或闲置；不直接证明运行会更快。</text><text x="32" y="1025" font-size="19" fill="#526477">图中柱高是容量限制前的分配需求；蓝色部分不代表“整个模型只计算这些 token”。</text></g></svg>