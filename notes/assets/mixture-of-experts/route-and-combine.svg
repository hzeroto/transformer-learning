<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1370" viewBox="0 0 1050 1370" role="img" aria-labelledby="title description"><title id="title">4 个 token 如何分给专家，再恢复原顺序</title><desc id="description">E=3，k=2，4 个 token 各选 2 个专家。先给出完整专家概率和所选专家归一化权重，再按专家分组，最后按原 token 下标加权累加。总计 8 次 token-专家分配，整条 C 维向量参与每个被选专家。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker></defs><rect width="1050" height="1370" fill="white"/><g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" fill="#172b40"><text x="32" y="47" font-size="28" font-weight="600">4 个 token 如何分给专家，再恢复原顺序</text><text x="32" y="85" font-size="20" >MoE 输入展平为 Z_flat：(N, C)，N = B × T = 4；一行 zᵢ 是完整的 C 维向量。</text><text x="32" y="118" font-size="20" >3 个专家（E = 3）；每个 token 选 2 个（k = 2）；本图不设容量限制。</text><text x="32" y="164" font-size="23" font-weight="600">① Router 对每个 token 打分；Softmax 得到所有专家的概率 p。</text><rect x="32" y="187" width="986" height="253" rx="9" fill="white" stroke="#c8d3df" /><rect x="33" y="188" width="984" height="48" fill="#f1f4f7"/><text x="95" y="220" font-size="20" text-anchor="middle" font-weight="600">token</text><text x="216.5" y="220" font-size="20" text-anchor="middle" font-weight="600">p₀</text><text x="333.5" y="220" font-size="20" text-anchor="middle" font-weight="600">p₁</text><text x="450.5" y="220" font-size="20" text-anchor="middle" font-weight="600">p₂</text><text x="610" y="220" font-size="20" text-anchor="middle" font-weight="600">选中专家</text><text x="864.5" y="220" font-size="20" text-anchor="middle" font-weight="600">所选权重（和为 1）</text><text x="95" y="273" font-size="22" text-anchor="middle" font-weight="600">z₀</text><text x="216.5" y="273" font-size="21" text-anchor="middle" >0.60</text><text x="333.5" y="273" font-size="21" text-anchor="middle" >0.30</text><text x="450.5" y="273" font-size="21" text-anchor="middle" >0.10</text><text x="610" y="273" font-size="21" text-anchor="middle" fill="#17639b">0、1</text><text x="864" y="273" font-size="19" text-anchor="middle" >w₀=0.667；w₁=0.333</text><path d="M32 290 H1018" fill="none" stroke="#c8d3df" stroke-width="2" /><text x="95" y="323" font-size="22" text-anchor="middle" font-weight="600">z₁</text><text x="216.5" y="323" font-size="21" text-anchor="middle" >0.20</text><text x="333.5" y="323" font-size="21" text-anchor="middle" >0.50</text><text x="450.5" y="323" font-size="21" text-anchor="middle" >0.30</text><text x="610" y="323" font-size="21" text-anchor="middle" fill="#17639b">1、2</text><text x="864" y="323" font-size="19" text-anchor="middle" >w₁=0.625；w₂=0.375</text><path d="M32 340 H1018" fill="none" stroke="#c8d3df" stroke-width="2" /><text x="95" y="373" font-size="22" text-anchor="middle" font-weight="600">z₂</text><text x="216.5" y="373" font-size="21" text-anchor="middle" >0.10</text><text x="333.5" y="373" font-size="21" text-anchor="middle" >0.20</text><text x="450.5" y="373" font-size="21" text-anchor="middle" >0.70</text><text x="610" y="373" font-size="21" text-anchor="middle" fill="#17639b">2、1</text><text x="864" y="373" font-size="19" text-anchor="middle" >w₂=0.778；w₁=0.222</text><path d="M32 390 H1018" fill="none" stroke="#c8d3df" stroke-width="2" /><text x="95" y="423" font-size="22" text-anchor="middle" font-weight="600">z₃</text><text x="216.5" y="423" font-size="21" text-anchor="middle" >0.55</text><text x="333.5" y="423" font-size="21" text-anchor="middle" >0.10</text><text x="450.5" y="423" font-size="21" text-anchor="middle" >0.35</text><text x="610" y="423" font-size="21" text-anchor="middle" fill="#17639b">0、2</text><text x="864" y="423" font-size="19" text-anchor="middle" >w₀=0.611；w₂=0.389</text><text x="32" y="477" font-size="21" >例如 z₀：保留 p₀ = 0.6、p₁ = 0.3，再除以 0.9 → 权重 2/3、1/3。</text><text x="32" y="511" font-size="19" fill="#526477">归一化只在选中的两个专家之间进行；表中小数显示到 3 位，计算保留完整精度。</text><text x="32" y="563" font-size="23" font-weight="600">② 按专家分组，让同一个专家一次处理分给自己的 token。</text><rect x="32" y="588" width="310" height="237" rx="9" fill="#dcecf9" stroke="#c8d3df" /><text x="52" y="625" font-size="23" font-weight="600">专家 0：F₀</text><text x="52" y="663" font-size="21" >输入行：z₀、z₃</text><text x="52" y="699" font-size="20" >输入 shape：(2, C)</text><text x="52" y="737" font-size="21" >运行自己的完整 FFN</text><text x="52" y="777" font-size="20" >输出 shape：(2, C)</text><rect x="370" y="588" width="310" height="237" rx="9" fill="#f0e7f6" stroke="#c8d3df" /><text x="390" y="625" font-size="23" font-weight="600">专家 1：F₁</text><text x="390" y="663" font-size="21" >输入行：z₀、z₁、z₂</text><text x="390" y="699" font-size="20" >输入 shape：(3, C)</text><text x="390" y="737" font-size="21" >运行自己的完整 FFN</text><text x="390" y="777" font-size="20" >输出 shape：(3, C)</text><rect x="708" y="588" width="310" height="237" rx="9" fill="#e7f2eb" stroke="#c8d3df" /><text x="728" y="625" font-size="23" font-weight="600">专家 2：F₂</text><text x="728" y="663" font-size="21" >输入行：z₁、z₂、z₃</text><text x="728" y="699" font-size="20" >输入 shape：(3, C)</text><text x="728" y="737" font-size="21" >运行自己的完整 FFN</text><text x="728" y="777" font-size="20" >输出 shape：(3, C)</text><text x="32" y="863" font-size="20" >4 个 token × 每个选 2 个专家 = 8 次分配；同一 zᵢ 会出现在两个专家的输入里。</text><text x="32" y="897" font-size="20" fill="#17639b">复制的是整条 C 维向量；没有把前 C/2 维、后 C/2 维分给不同专家。</text><text x="32" y="949" font-size="23" font-weight="600">③ 用原 token 编号找回位置，把专家输出乘权重后相加。</text><rect x="32" y="973" width="986" height="249" rx="9" fill="#f8fafc" stroke="#c8d3df" /><text x="59" y="1015" font-size="24" >y₀ ≈ 0.667 × F₀(z₀) + 0.333 × F₁(z₀)</text><text x="59" y="1069" font-size="24" >y₁ ≈ 0.625 × F₁(z₁) + 0.375 × F₂(z₁)</text><text x="59" y="1123" font-size="24" >y₂ ≈ 0.222 × F₁(z₂) + 0.778 × F₂(z₂)</text><text x="59" y="1177" font-size="24" >y₃ ≈ 0.611 × F₀(z₃) + 0.389 × F₂(z₃)</text><text x="32" y="1264" font-size="22" >输出 Y：(4, C)，行顺序仍是 y₀、y₁、y₂、y₃；随后恢复成 (B, T, C)。</text><text x="32" y="1301" font-size="20" >若两位专家都处理 z₀，两份结果必须累加到 y₀；不能让后写入的结果覆盖前一份。</text><text x="32" y="1341" font-size="20" fill="#526477">每位专家的 FFN 参数各自独立；Router 决定本次计算选谁、各占多少权重。</text></g></svg>