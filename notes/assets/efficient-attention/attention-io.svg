<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1117" viewBox="0 0 1040 1117" role="img" aria-labelledby="title description"><title id="title">FlashAttention 改变的是中间结果的存放与复用</title><desc id="description">GPU 显存 HBM 与片上存储的对照。普通非融合实现将完整分数和权重矩阵写回 HBM；分块实现载入小块，在片上维护每个 query 的最大值、分母和加权和，最终写回输出，不将完整分数或权重矩阵存入 HBM。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker></defs><rect width="1040" height="1117" fill="white"/><g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" fill="#172b40"><text x="32" y="45" font-size="27" font-weight="600">FlashAttention 改变的是中间结果的存放与复用</text><text x="32" y="82" font-size="18" >固定 b、h：Q、K 的 shape 为 (T, Dk)，V、O 为 (T, Dv)；省略 batch 和 head 轴。</text><text x="32" y="119" font-size="23" font-weight="600">A. 普通非融合实现：完整 S、A 在算子之间进出 HBM</text><rect x="32" y="142" width="451" height="337" rx="8" fill="#f7f9fc" stroke="#c8d3df" /><rect x="535" y="142" width="473" height="337" rx="8" fill="#f1f8fb" stroke="#c8d3df" /><text x="54" y="174" font-size="20" font-weight="600">GPU 显存 / HBM：容量大</text><text x="557" y="174" font-size="20" font-weight="600">GPU 片上：计算时暂存数据</text><rect x="55" y="198" width="404" height="47" rx="8" fill="white" stroke="#c8d3df" /><text x="76" y="228" font-size="19" >Q、K（V 也已在 HBM）</text><rect x="55" y="266" width="404" height="47" rx="8" fill="#fff0df" stroke="#c8d3df" /><text x="76" y="296" font-size="19" >分数 S：(T, T)</text><rect x="55" y="334" width="404" height="47" rx="8" fill="#fff0df" stroke="#c8d3df" /><text x="76" y="364" font-size="19" >权重 A：(T, T)；以及 V</text><rect x="55" y="402" width="404" height="47" rx="8" fill="white" stroke="#c8d3df" /><text x="76" y="432" font-size="19" >最终输出 O：(T, Dv)</text><rect x="560" y="198" width="424" height="47" rx="8" fill="white" stroke="#c8d3df" /><text x="585" y="228" font-size="19" >S = Q @ Kᵀ / sqrt(Dk)</text><path d="M459 221 H560" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><path d="M772 245 V254 H504 V289 H459" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="560" y="266" width="424" height="47" rx="8" fill="white" stroke="#c8d3df" /><text x="585" y="296" font-size="19" >A = softmax(S + mask)</text><path d="M459 289 H560" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><path d="M772 313 V322 H504 V357 H459" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="560" y="334" width="424" height="47" rx="8" fill="white" stroke="#c8d3df" /><text x="585" y="364" font-size="19" >O = A @ V</text><path d="M459 357 H560" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><path d="M772 381 V390 H504 V425 H459" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="488" y="210" font-size="16" >读</text><text x="512" y="263" font-size="16" >写</text><text x="488" y="278" font-size="16" >读</text><text x="512" y="331" font-size="16" >写</text><text x="488" y="346" font-size="16" >读</text><text x="512" y="399" font-size="16" >写</text><text x="558" y="443" font-size="17" fill="#526477">mask 相同，才是在比较同一个 Attention。</text><text x="32" y="533" font-size="23" font-weight="600">B. 分块与融合：小块计算、在线合并，中间大矩阵不落 HBM</text><rect x="32" y="555" width="451" height="453" rx="8" fill="#f7f9fc" stroke="#c8d3df" /><rect x="535" y="555" width="473" height="453" rx="8" fill="#f1f8fb" stroke="#c8d3df" /><text x="54" y="588" font-size="20" font-weight="600">GPU 显存 / HBM</text><text x="557" y="588" font-size="20" font-weight="600">GPU 片上存储：小而快</text><rect x="55" y="615" width="404" height="66" rx="8" fill="white" stroke="#c8d3df" /><text x="76" y="642" font-size="18" >Q、K、V 的完整输入</text><text x="76" y="667" font-size="18" >按需要读入当前 query 块 / key-value 块</text><path d="M459 648 H560" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="560" y="615" width="424" height="66" rx="8" fill="white" stroke="#c8d3df" /><text x="578" y="641" font-size="18" >Qᵢ：(Bq, Dk)    Kⱼ：(Bk, Dk)</text><text x="578" y="666" font-size="18" >Vⱼ：(Bk, Dv)；Bq / Bk 是块长度</text><path d="M772 681 V708" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="560" y="710" width="424" height="51" rx="8" fill="white" stroke="#c8d3df" /><text x="578" y="742" font-size="18" >当前分数块 Sᵢⱼ：(Bq, Bk) + mask</text><path d="M772 761 V790" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="560" y="792" width="424" height="95" rx="8" fill="#dcecf9" stroke="#c8d3df" /><text x="578" y="818" font-size="18" >计算指数权重，在线更新每个 query：</text><text x="578" y="844" font-size="18" >m：最大分数；l：指数权重之和</text><text x="578" y="870" font-size="18" >u：(Dv,) 向量，未归一化的加权和</text><path d="M772 887 V920" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="560" y="922" width="424" height="58" rx="8" fill="white" stroke="#c8d3df" /><text x="578" y="946" font-size="18" >全部合法 key 块处理完后</text><text x="578" y="970" font-size="18" >每个 query 输出 Oᵢ = u / l</text><rect x="55" y="922" width="404" height="58" rx="8" fill="white" stroke="#c8d3df" /><text x="76" y="957" font-size="18" >写回 O 的当前块：(Bq, Dv)</text><path d="M560 951 H459" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="76" y="740" font-size="20" fill="#17639b">不存完整 S：(T, T)</text><text x="76" y="774" font-size="20" fill="#17639b">不存完整 A：(T, T)</text><text x="76" y="808" font-size="20" fill="#17639b">保留输入、输出及必要统计量。</text><text x="76" y="859" font-size="18" >片上状态可跨 key 块继续累积；</text><text x="76" y="887" font-size="18" >具体循环顺序决定输入块的复用。</text><text x="32" y="1042" font-size="19" >减少的是大中间张量的显存读写；完整精确 Attention 的二次算术量没有因此消失。</text><text x="32" y="1074" font-size="18" fill="#526477">HBM 是 GPU 显存，不是 CPU 内存；图不承诺每个输入块只读一次。</text><text x="32" y="1104" font-size="18" fill="#526477">CPU 分块代码可验证算法；只有实际融合内核与硬件测量，才能验证 GPU 性能。</text></g></svg>