<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">nn.Parameter 注册与未注册张量的去向对照</title>
  <desc id="desc">左侧 gamma 用 nn.Parameter 包装，被模块登记进 parameters 名册，因此进入优化器、得到梯度、写入 state_dict。右侧 gamma 是普通 Tensor，赋值给属性后仍可参与前向计算，但不在名册中，因此优化器看不到它、backward 后 grad 为 None、state_dict 里没有这个键，保存恢复会静默回到初始值。</desc>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a4534f"/>
    </marker>
    <style>
      text { font-family: "PingFang SC","Noto Sans CJK SC",sans-serif; fill:#172b3a; font-size:18px; text-anchor:middle; }
      .title { font-size:26px; font-weight:600; }
      .sub { font-size:17px; fill:#4a5b6a; }
      .hdr { font-size:20px; font-weight:600; }
      .box { fill:#f5f7fa; stroke:#9cabb8; stroke-width:1.5; rx:10; }
      .okbox { fill:#e9f2ec; stroke:#5d9c6d; stroke-width:2; rx:10; }
      .badbox { fill:#f7ecec; stroke:#b57b7b; stroke-width:2; rx:10; }
      .roster { fill:#eaf3fa; stroke:#7e9eb8; stroke-width:2; rx:10; }
      .flow { fill:none; stroke:#334155; stroke-width:2.2; marker-end:url(#ar2); }
      .bad { fill:none; stroke:#a4534f; stroke-width:2.2; stroke-dasharray:7 5; marker-end:url(#arx); }
      .note { font-size:15px; fill:#4a5b6a; }
      .mono { font-family:"DejaVu Sans Mono",monospace; font-size:16px; }
      .lbl { font-weight:600; }
      .divider { stroke:#c9d3dc; stroke-width:1.5; stroke-dasharray:6 5; }
    </style>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>

  <text x="450" y="36" class="title">同样赋值给 self.gamma，去向完全不同</text>
  <text x="450" y="64" class="sub">两侧都能算出正确的前向结果；差别只在模块是否把它登记进参数名册</text>

  <line class="divider" x1="450" y1="88" x2="450" y2="600"/>

  <!-- ===== 左：已注册 ===== -->
  <text x="228" y="118" class="hdr">已注册</text>
  <rect class="okbox" x="48" y="136" width="360" height="62"/>
  <text x="228" y="160" class="mono">self.gamma = nn.Parameter(</text>
  <text x="228" y="184" class="mono">    torch.ones(C))</text>

  <path class="flow" d="M228 198 V238"/>

  <rect class="roster" x="48" y="238" width="360" height="66"/>
  <text x="228" y="264" class="lbl">模块的参数名册</text>
  <text x="228" y="290" class="mono">named_parameters() → 'gamma'</text>

  <path class="flow" d="M228 304 V344"/>

  <rect class="box" x="48" y="344" width="360" height="50"/>
  <text x="228" y="375">① 优化器收到它，会被更新</text>

  <path class="flow" d="M228 394 V430"/>
  <rect class="box" x="48" y="430" width="360" height="50"/>
  <text x="228" y="461">② requires_grad=True，有 .grad</text>

  <path class="flow" d="M228 480 V516"/>
  <rect class="box" x="48" y="516" width="360" height="50"/>
  <text x="228" y="547">③ 进入 state_dict，能存能恢复</text>

  <text x="228" y="592" class="note">训练学到的数值真正被保留</text>

  <!-- ===== 右：未注册 ===== -->
  <text x="672" y="118" class="hdr">未注册</text>
  <rect class="badbox" x="492" y="136" width="360" height="62"/>
  <text x="672" y="160" class="mono">self.gamma =</text>
  <text x="672" y="184" class="mono">    torch.ones(C)</text>

  <path class="bad" d="M672 198 V238"/>

  <rect class="badbox" x="492" y="238" width="360" height="66"/>
  <text x="672" y="264" class="lbl">名册里没有它</text>
  <text x="672" y="290" class="mono">named_parameters() → 只有别的</text>

  <path class="bad" d="M672 304 V344"/>

  <rect class="badbox" x="492" y="344" width="360" height="50"/>
  <text x="672" y="375">① 优化器看不到，永不更新</text>

  <path class="bad" d="M672 394 V430"/>
  <rect class="badbox" x="492" y="430" width="360" height="50"/>
  <text x="672" y="461">② .grad 一直是 None</text>

  <path class="bad" d="M672 480 V516"/>
  <rect class="badbox" x="492" y="516" width="360" height="50"/>
  <text x="672" y="547">③ 不在 state_dict，恢复回初始值</text>

  <text x="672" y="592" class="note">前向不报错，问题全部是静默的</text>
</svg>
