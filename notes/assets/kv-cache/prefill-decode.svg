<text x="378.0" y="164.0" class="cell">3</text>
<rect x="396" y="146" width="28" height="28" class="new"/>
<text x="410.0" y="164.0" class="cell">4</text>
<text x="442" y="164.0" class="note">allowed (1,5,5)  下三角</text>
<text x="118" y="164.0" class="pfill" text-anchor="end">prefill</text>
<text x="256" y="204.0" class="rl" text-anchor="end">第 2 次   n=1</text>
<rect x="268" y="186" width="28" height="28" class="old"/>
<text x="282.0" y="204.0" class="cell">0</text>
<rect x="300" y="186" width="28" height="28" class="old"/>
<text x="314.0" y="204.0" class="cell">1</text>
<rect x="332" y="186" width="28" height="28" class="old"/>
