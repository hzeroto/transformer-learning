<rect x="396" y="186" width="28" height="28" class="old"/>
<text x="410.0" y="204.0" class="cell">4</text>
<rect x="428" y="186" width="28" height="28" class="new"/>
<text x="442.0" y="204.0" class="cell">5</text>
<text x="474" y="204.0" class="note">allowed (1,1,6)  全 True</text>
<text x="118" y="204.0" class="pdec" text-anchor="end">decode</text>
