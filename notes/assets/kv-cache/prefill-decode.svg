<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Noto Serif CJK SC, AR PL UMing CN, DejaVu Sans, sans-serif">
<style>
.ph{font-size:14.5px;font-weight:700;fill:#111}
.rl{font-size:11.5px;fill:#333}
.cell{font-size:11px;fill:#fff;text-anchor:middle;font-weight:600}
.old{fill:#2f6fd0;stroke:#1a4c94;stroke-width:1}
.new{fill:#e07b28;stroke:#a85510;stroke-width:1.4}
.note{font-size:11px;fill:#555}
.pfill{font-size:11px;fill:#1a4c94;font-weight:700}
.pdec{font-size:11px;fill:#a85510;font-weight:700}
.brace{fill:none;stroke:#a85510;stroke-width:1.2}
.codebox{fill:#f7f9fc;stroke:#c8d4e4;stroke-width:1}
.code{font-size:12.5px;fill:#222;font-family:monospace}
.codesub{font-size:11px;fill:#666}
.hl{fill:#c2410c;font-weight:700}
.hr{stroke:#ccc;stroke-width:1} .hr2{stroke:#999;stroke-width:1}
.th{font-size:12px;font-weight:700;fill:#111}
.td{font-size:12px;fill:#333} .tdk{font-size:12px;fill:#555}
.tdb{font-size:12px;fill:#1a4c94;font-weight:600}
.lg{font-size:11.5px;fill:#333}
</style>
<rect width="960" height="560" fill="#fff"/>
<text x="480.0" y="30" style="font-size:16px;font-weight:700;fill:#111" text-anchor="middle">prefill 和 decode 不是两套机制，是同一段代码的两种情形</text>
<text x="480.0" y="50" style="font-size:11.5px;fill:#555" text-anchor="middle">格子里的数字是位置下标 · 蓝=缓存中已有，本步复用 · 橙=本步新算并追加</text>
<rect x="60" y="66" width="840" height="52" rx="5" class="codebox"/>
<text x="76" y="86" class="code">cache.append(k_new, v_new)  →  Q:(B,<tspan class="hl">n</tspan>,C) · K/V:(B,<tspan class="hl">L</tspan>,C) · allowed:(B,<tspan class="hl">n</tspan>,<tspan class="hl">L</tspan>) = ( j ≤ L−n+i )</text>
<text x="76" y="106" class="codesub">同一段代码，四次调用。下面每一行只有 n 和 L 不同 —— 没有第二套逻辑。</text>
<text x="256" y="164.0" class="rl" text-anchor="end">第 1 次   n=5</text>
<rect x="268" y="146" width="28" height="28" class="new"/>
<text x="282.0" y="164.0" class="cell">0</text>
<rect x="300" y="146" width="28" height="28" class="new"/>
<text x="314.0" y="164.0" class="cell">1</text>
<rect x="332" y="146" width="28" height="28" class="new"/>
<text x="346.0" y="164.0" class="cell">2</text>
