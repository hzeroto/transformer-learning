<path d="M 132 186 L 124 186 L 124 294 L 132 294" class="brace"/>
<line x1="55" y1="320" x2="905" y2="320" class="hr"/>
<text x="60" y="346" class="ph">这一处改动带来什么</text>
<text x="60" y="372" class="th"></text>
<text x="260" y="372" class="th">ex010 的写法</text>
<text x="510" y="372" class="th">带缓存</text>
<line x1="55" y1="379" x2="905" y2="379" class="hr2"/>
<text x="60" y="400" class="tdk">每次前向的 token 数</text>
<text x="260" y="400" class="td">整个前缀，逐步变长</text>
<text x="510" y="400" class="tdb">prefill 1 次，之后固定 1</text>
<text x="60" y="428" class="tdk">每次新算的 K/V 行数</text>
<text x="260" y="428" class="td">全部重算</text>
<text x="510" y="428" class="tdb">只算 n 行</text>
<text x="60" y="456" class="tdk">前缀 5、生成 6 步累计</text>
<text x="260" y="456" class="td">45 行（39 行重复）</text>
<text x="510" y="456" class="tdb">11 行</text>
<text x="60" y="484" class="tdk">额外内存</text>
<text x="260" y="484" class="td">无</text>
<text x="510" y="484" class="tdb">2 × 层 × B × L × H_kv × Dh × 字节</text>
<rect x="60" y="530" width="13" height="13" class="old"/><text x="79" y="541" class="lg">缓存中已有</text>
<rect x="190" y="530" width="13" height="13" class="new"/><text x="209" y="541" class="lg">本步新算的 n 行</text>
<text x="360" y="541" class="lg">前提：K[t]=X[t]@Wk 只依赖位置 t，追加新 token 不改变已有行（实测差 0.0）</text>
</svg>