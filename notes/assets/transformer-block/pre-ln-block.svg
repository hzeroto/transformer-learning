<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
  <title id="title">Pre-LN Transformer Block 主干</title>
  <desc id="desc">完整张量沿主路从 X 到 LN1、MHA，原始 X 走旁路逐元素相加得到 U。U 再经 LN2、FFN，原始 U 走第二条旁路相加得到 Y。所有块级表示均为 B,T,C，权限 input_valid 为 B,T，只进入 MHA。无 Dropout。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155"/>
    </marker>
    <marker id="skip-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#215a88"/>
    </marker>
    <style>
      text { font-family: "PingFang SC","Noto Sans CJK SC",sans-serif; fill:#172b3a; font-size:24px; text-anchor:middle; }
      .title { font-size:30px; font-weight:600; }
      .label { font-weight:600; }
      .node { fill:#f5f7fa; stroke:#9cabb8; stroke-width:1.5; rx:12; }
      .op { fill:#eaf3fa; stroke:#7e9eb8; stroke-width:1.5; rx:12; }
      .flow { fill:none; stroke:#334155; stroke-width:2.5; marker-end:url(#arrow); }
      .skip { fill:none; stroke:#215a88; stroke-width:3; marker-end:url(#skip-arrow); }
    </style>
  </defs>
  <rect width="720" height="1120" fill="#ffffff"/>
  <text x="360" y="42" class="title">Pre-LN：归一化只在变换支路上</text>
  <text x="360" y="78">完整 shape · 无 Dropout · 加号为逐元素相加</text>

  <rect x="260" y="108" width="240" height="64" class="node"/>
  <text x="380" y="135" class="label">X · 块输入</text>
  <text x="380" y="161">(B,T,C)</text>
  <path class="flow" d="M380 172 V218"/>
  <circle cx="380" cy="190" r="4.5" fill="#215a88"/>
  <path class="skip" d="M380 190 H74 V455 H355"/>
  <text x="162" y="295">原始 X</text>
  <text x="162" y="326">(B,T,C)</text>
  <text x="162" y="357">不经 LN1</text>

  <rect x="260" y="218" width="240" height="68" class="op"/>
  <text x="380" y="247" class="label">LN1 → N1</text>
  <text x="380" y="276">(B,T,C)</text>
  <path class="flow" d="M380 286 V330"/>

  <rect x="260" y="330" width="240" height="78" class="op"/>
  <text x="380" y="361" class="label">MHA → A</text>
  <text x="380" y="393">(B,T,C)</text>
  <text x="609" y="270">input_valid</text>
  <text x="609" y="302">(B,T)</text>
  <path class="flow" d="M609 314 V369 H501"/>
  <path class="flow" d="M380 408 V430"/>
  <circle cx="380" cy="455" r="25" fill="#ffffff" stroke="#215a88" stroke-width="3"/>
  <text x="380" y="464" font-size="32">+</text>
  <text x="552" y="464">逐元素相加</text>
  <path class="flow" d="M380 480 V512"/>

  <rect x="260" y="512" width="240" height="70" class="node"/>
  <text x="380" y="543" class="label">U = X + A</text>
  <text x="380" y="572">(B,T,C)</text>
  <path class="flow" d="M380 582 V633"/>
  <circle cx="380" cy="603" r="4.5" fill="#215a88"/>
  <path class="skip" d="M380 603 H74 V888 H355"/>
  <text x="162" y="715">更新后的 U</text>
  <text x="162" y="746">(B,T,C)</text>
  <text x="162" y="777">不经 LN2</text>

  <rect x="260" y="633" width="240" height="68" class="op"/>
  <text x="380" y="662" class="label">LN2 → N2</text>
  <text x="380" y="691">(B,T,C)</text>
  <path class="flow" d="M380 701 V745"/>

  <rect x="260" y="745" width="240" height="102" class="op"/>
  <text x="380" y="776" class="label">FFN → D</text>
  <text x="380" y="806">C → F → C</text>
  <text x="380" y="836">输出 (B,T,C)</text>
  <path class="flow" d="M380 847 V863"/>
  <circle cx="380" cy="888" r="25" fill="#ffffff" stroke="#215a88" stroke-width="3"/>
  <text x="380" y="897" font-size="32">+</text>
  <text x="552" y="897">逐元素相加</text>
  <path class="flow" d="M380 913 V951"/>

  <rect x="260" y="951" width="240" height="70" class="node"/>
  <text x="380" y="982" class="label">Y = U + D</text>
  <text x="380" y="1011">(B,T,C)</text>
  <text x="360" y="1067">LN1 / LN2：各自拥有独立的缩放和平移参数</text>
  <text x="360" y="1101">MHA 已含 Wo；FFN 的 D 不是特征维度符号</text>
</svg>
