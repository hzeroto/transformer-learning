<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="880" viewBox="0 0 1060 880" role="img" aria-labelledby="title description"><title id="title">Vision Transformer (ViT) 端到端架构与数据流</title><desc id="description">展示从二维图像分块、展平线性投影为 Patch Tokens、拼接入 CLS Token、叠加一维可学习位置编码，送入标准 Transformer Encoder，最后通过 MLP Head 进行分类的完整流水线。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker></defs><rect width="1060" height="880" fill="white"/><g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" fill="#172b40"><text x="32" y="45" font-size="26" font-weight="600">Vision Transformer (ViT)：图像到序列的端到端架构</text><text x="32" y="80" font-size="17" fill="#526477">输入图像 (H, W, C) → 切分成 N 个 (P, P, C) 图块 → 线性映射为向量 → 拼 CLS 与位置编码 → 标准 Encoder → 分类头</text><rect x="40" y="115" width="300" height="310" rx="8" fill="#f8fafc" stroke="#c8d3df" /><text x="190" y="145" font-size="18" text-anchor="middle" font-weight="600" fill="#17639b">① 图像分块 (Patch Extraction)</text><text x="190" y="172" font-size="14" text-anchor="middle" fill="#526477">原图: H×W×C（下方网格仅示意）</text><rect x="115" y="190" width="50" height="50" rx="4" fill="#e0effa" stroke="#3182ce" stroke-width="1.5"/><text x="140" y="220" font-size="14" text-anchor="middle" font-weight="600" fill="#17639b">P1</text><rect x="169" y="190" width="50" height="50" rx="4" fill="#e0effa" stroke="#3182ce" stroke-width="1.5"/><text x="194" y="220" font-size="14" text-anchor="middle" font-weight="600" fill="#17639b">P2</text><rect x="223" y="190" width="50" height="50" rx="4" fill="#e0effa" stroke="#3182ce" stroke-width="1.5"/><text x="248" y="220" font-size="14" text-anchor="middle" font-weight="600" fill="#17639b">P3</text><rect x="115" y="244" width="50" height="50" rx="4" fill="#e0effa" stroke="#3182ce" stroke-width="1.5"/><text x="140" y="274" font-size="14" text-anchor="middle" font-weight="600" fill="#17639b">P4</text><rect x="169" y="244" width="50" height="50" rx="4" fill="#e0effa" stroke="#3182ce" stroke-width="1.5"/><text x="194" y="274" font-size="14" text-anchor="middle" font-weight="600" fill="#17639b">P5</text><rect x="223" y="244" width="50" height="50" rx="4" fill="#e0effa" stroke="#3182ce" stroke-width="1.5"/><text x="248" y="274" font-size="14" text-anchor="middle" font-weight="600" fill="#17639b">P6</text><rect x="115" y="298" width="50" height="50" rx="4" fill="#e0effa" stroke="#3182ce" stroke-width="1.5"/><text x="140" y="328" font-size="14" text-anchor="middle" font-weight="600" fill="#17639b">P7</text><rect x="169" y="298" width="50" height="50" rx="4" fill="#e0effa" stroke="#3182ce" stroke-width="1.5"/><text x="194" y="328" font-size="14" text-anchor="middle" font-weight="600" fill="#17639b">P8</text><rect x="223" y="298" width="50" height="50" rx="4" fill="#e0effa" stroke="#3182ce" stroke-width="1.5"/><text x="248" y="328" font-size="14" text-anchor="middle" font-weight="600" fill="#17639b">P9</text><text x="190" y="375" font-size="14" text-anchor="middle" font-weight="500">切成 N = (H/P) × (W/P) 个图块</text><text x="190" y="398" font-size="13" text-anchor="middle" fill="#526477">每个图块展平维度: P² · C (如 16×16×3 = 768)</text><path d="M340 270 H390" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="115" width="630" height="310" rx="8" fill="#f8fafc" stroke="#c8d3df" /><text x="705" y="145" font-size="18" text-anchor="middle" font-weight="600" fill="#8650aa">② 线性投影与序列构造 (Patch Embedding + CLS + Pos)</text><rect x="420" y="180" width="80" height="45" rx="8" fill="#fdf3eb" stroke="#d96b27" stroke-width="1.5"/><text x="460" y="208" font-size="15" text-anchor="middle" font-weight="600" fill="#d96b27">[CLS]</text><text x="460" y="248" font-size="18" text-anchor="middle" font-weight="600" fill="#526477">+</text><rect x="420" y="260" width="80" height="40" rx="8" fill="#fdfaf6" stroke="#d96b27" stroke-dasharray="3,3"/><text x="460" y="285" font-size="13" text-anchor="middle" font-weight="500" fill="#d96b27">Pos 0</text><rect x="515" y="180" width="80" height="45" rx="8" fill="#dcecf9" stroke="#17639b" stroke-width="1.5"/><text x="555" y="208" font-size="15" text-anchor="middle" font-weight="600" fill="#17639b">P1</text><text x="555" y="248" font-size="18" text-anchor="middle" font-weight="600" fill="#526477">+</text><rect x="515" y="260" width="80" height="40" rx="8" fill="#fdfaf6" stroke="#d96b27" stroke-dasharray="3,3"/><text x="555" y="285" font-size="13" text-anchor="middle" font-weight="500" fill="#d96b27">Pos 1</text><rect x="610" y="180" width="80" height="45" rx="8" fill="#dcecf9" stroke="#17639b" stroke-width="1.5"/><text x="650" y="208" font-size="15" text-anchor="middle" font-weight="600" fill="#17639b">P2</text><text x="650" y="248" font-size="18" text-anchor="middle" font-weight="600" fill="#526477">+</text><rect x="610" y="260" width="80" height="40" rx="8" fill="#fdfaf6" stroke="#d96b27" stroke-dasharray="3,3"/><text x="650" y="285" font-size="13" text-anchor="middle" font-weight="500" fill="#d96b27">Pos 2</text><rect x="705" y="180" width="80" height="45" rx="8" fill="#dcecf9" stroke="#17639b" stroke-width="1.5"/><text x="745" y="208" font-size="15" text-anchor="middle" font-weight="600" fill="#17639b">P3</text><text x="745" y="248" font-size="18" text-anchor="middle" font-weight="600" fill="#526477">+</text><rect x="705" y="260" width="80" height="40" rx="8" fill="#fdfaf6" stroke="#d96b27" stroke-dasharray="3,3"/><text x="745" y="285" font-size="13" text-anchor="middle" font-weight="500" fill="#d96b27">Pos 3</text><rect x="800" y="180" width="80" height="45" rx="8" fill="#f1f4f7" stroke="#526477" stroke-width="1.5"/><text x="840" y="208" font-size="15" text-anchor="middle" font-weight="600" fill="#526477">...</text><text x="840" y="248" font-size="18" text-anchor="middle" font-weight="600" fill="#526477">+</text><rect x="800" y="260" width="80" height="40" rx="8" fill="#fdfaf6" stroke="#d96b27" stroke-dasharray="3,3"/><text x="840" y="285" font-size="13" text-anchor="middle" font-weight="500" fill="#d96b27">...</text><rect x="895" y="180" width="80" height="45" rx="8" fill="#dcecf9" stroke="#17639b" stroke-width="1.5"/><text x="935" y="208" font-size="15" text-anchor="middle" font-weight="600" fill="#17639b">PN</text><text x="935" y="248" font-size="18" text-anchor="middle" font-weight="600" fill="#526477">+</text><rect x="895" y="260" width="80" height="40" rx="8" fill="#fdfaf6" stroke="#d96b27" stroke-dasharray="3,3"/><text x="935" y="285" font-size="13" text-anchor="middle" font-weight="500" fill="#d96b27">Pos N</text><path d="M705 315 V355" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="355" width="570" height="50" rx="8" fill="white" stroke="#8650aa" /><text x="705" y="386" font-size="16" text-anchor="middle" font-weight="600" fill="#8650aa">最终进入 Encoder 的序列: (B, N+1, D)    (D = 模型隐藏维度)</text><path d="M705 425 V475" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="180" y="475" width="700" height="175" rx="8" fill="#f4fbf7" stroke="#256846" /><text x="530" y="505" font-size="20" text-anchor="middle" font-weight="600" fill="#256846">③ 标准 Transformer Encoder（复用 Attention 与 FFN 积木）</text><rect x="210" y="525" width="640" height="105" rx="8" fill="white" stroke="#c8d3df" /><text x="530" y="555" font-size="15" text-anchor="middle">• 堆叠 L 层标准 Pre-LN Transformer Block（双向 Multi-Head Self-Attention + FFN）</text><text x="530" y="581" font-size="15" text-anchor="middle">• 全序列双向可见（无因果 Mask），所有 Patch Token 与 CLS Token 之间自由全局交互</text><text x="530" y="607" font-size="15" text-anchor="middle">• 输出保持同维度特征: (B, N+1, D)</text><path d="M530 650 V695" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="695" width="500" height="140" rx="8" fill="#fdfaf6" stroke="#d96b27" /><text x="530" y="725" font-size="19" text-anchor="middle" font-weight="600" fill="#d96b27">④ 分类头 (MLP Head)</text><rect x="310" y="745" width="440" height="70" rx="8" fill="white" stroke="#c8d3df" /><text x="530" y="772" font-size="15" text-anchor="middle" font-weight="600">提取第 0 位特征 z_cls = Output[:, 0, :] : (B, D)</text><text x="530" y="798" font-size="15" text-anchor="middle" fill="#172b40">logits = LayerNorm(z_cls) @ W_head + b_head</text></g></svg>