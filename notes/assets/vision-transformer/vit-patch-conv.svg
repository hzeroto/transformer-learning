<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="660" viewBox="0 0 1060 660" role="img" aria-labelledby="title description"><title id="title">Patch 展平映射与 2D 卷积实现的等价性</title><desc id="description">说明将图像切块展平后乘以权重矩阵 W 与使用核大小为 P、步长为 P 的 Conv2d 在数学与计算上的完全等价。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker></defs><rect width="1060" height="660" fill="white"/><g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" fill="#172b40"><text x="32" y="45" font-size="26" font-weight="600">Patch Embedding 的两种等价实现：矩阵乘法与跨步卷积</text><text x="32" y="80" font-size="17" fill="#526477">相同权重排列、偏置与分块约定下，两种写法计算相同；速度取决于设备和实现。</text><rect x="40" y="115" width="470" height="480" rx="8" fill="#f8fafc" stroke="#c8d3df" /><text x="275" y="150" font-size="20" text-anchor="middle" font-weight="600" fill="#17639b">A. 显式切块 + 展平 + 线性映射 (Linear)</text><text x="65" y="190" font-size="15" >① 固定一个 batch：将 (C,H,W) 切为 N 个 (C,P,P) 图块</text><text x="65" y="217" font-size="15" >② 展平每个图块为一维向量，长度为 (P² · C)</text><text x="65" y="244" font-size="15" >③ 组合为矩阵 X_patch : (N, P² · C)</text><text x="65" y="271" font-size="15" >④ 乘上投影参数 W_proj : (P² · C, D)</text><text x="65" y="298" font-size="15" >⑤ 得到 Patch Tokens : (N, D)</text><rect x="65" y="350" width="420" height="215" rx="8" fill="white" stroke="#c8d3df" /><text x="275" y="380" font-size="15" text-anchor="middle" font-weight="600">PyTorch 显式切块代码：</text><text x="85" y="412" font-size="13" font-family="monospace" fill="#17639b"># x: (B, C, H, W)</text><text x="85" y="432" font-size="13" font-family="monospace" fill="#17639b"># unfold 切块并展平：</text><text x="85" y="452" font-size="13" font-family="monospace" fill="#17639b">patches = x.unfold(2, P, P).unfold(3, P, P)</text><text x="85" y="472" font-size="13" font-family="monospace" fill="#17639b"># patches: (B, C, N_h, N_w, P, P)</text><text x="85" y="492" font-size="13" font-family="monospace" fill="#17639b">patches = patches.permute(0,2,3,1,4,5)</text><text x="85" y="512" font-size="13" font-family="monospace" fill="#17639b">patches = patches.reshape(B, -1, C*P*P)</text><text x="85" y="532" font-size="13" font-family="monospace" fill="#17639b"># 线性映射: (B, N, P*P*C) @ W_proj -&gt; (B, N, D)</text><text x="85" y="552" font-size="13" font-family="monospace" fill="#17639b">tokens = linear_proj(patches)</text><rect x="550" y="115" width="470" height="480" rx="8" fill="#f8fafc" stroke="#c8d3df" /><text x="785" y="150" font-size="20" text-anchor="middle" font-weight="600" fill="#256846">B. 跨步卷积一步到位 (Conv2d 习惯实现)</text><text x="575" y="190" font-size="15" >① 采用一个 2D 卷积层：</text><text x="575" y="217" font-size="15" >   - in_channels = C (如 3)</text><text x="575" y="244" font-size="15" >   - out_channels = D (如 768)</text><text x="575" y="271" font-size="15" >   - kernel_size = (P, P)</text><text x="575" y="298" font-size="15" >   - stride = (P, P) (不重叠滑动)</text><text x="575" y="325" font-size="15" >② 卷积输出 shape: (B, D, H/P, W/P) = (B, D, N_h, N_w)</text><text x="575" y="352" font-size="15" >③ 展平后两轴并转置: (B, D, N) → (B, N, D)</text><rect x="575" y="380" width="420" height="185" rx="8" fill="white" stroke="#c8d3df" /><text x="785" y="410" font-size="15" text-anchor="middle" font-weight="600">PyTorch Conv2d 标准实现：</text><text x="595" y="442" font-size="13" font-family="monospace" fill="#256846"># conv: in=C, out=D, kernel=P, stride=P</text><text x="595" y="464" font-size="13" font-family="monospace" fill="#256846">feat = conv2d(x) # (B, D, H/P, W/P)</text><text x="595" y="486" font-size="13" font-family="monospace" fill="#256846"># 展平空间维并交换轴:</text><text x="595" y="508" font-size="13" font-family="monospace" fill="#256846">tokens = feat.flatten(2).transpose(1, 2)</text><text x="595" y="530" font-size="13" font-family="monospace" fill="#256846"># 得到 (B, N, D)；CPU/GPU 均可验证</text><text x="32" y="625" font-size="17" font-weight="600">权重对应：W_proj = conv.weight.flatten(1).T；共享相同 bias，padding=0、dilation=1。</text></g></svg>