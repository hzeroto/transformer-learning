<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="720" viewBox="0 0 1060 720" role="img" aria-labelledby="title description"><title id="title">Top-k 与 Top-p 动态截断机制对照</title><desc id="description">对比 Top-k 的固定数量截断与 Top-p（核采样）根据累积概率动态自适应截断尾部的机制。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker></defs><rect width="1060" height="720" fill="white"/><g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" fill="#172b40"><text x="32" y="45" font-size="26" font-weight="600">截断采样：Top-k 与 Top-p（Nucleus Sampling）机制对比</text><text x="32" y="80" font-size="17" fill="#526477">截断将部分候选 logits 置为 -inf；低概率不等于错误，保留下来的高概率项也不保证正确。</text><rect x="40" y="115" width="470" height="510" rx="8" fill="#f8fafc" stroke="#c8d3df" /><text x="275" y="150" font-size="21" text-anchor="middle" font-weight="600" fill="#17639b">A. Top-k 采样（固定数量截断）</text><text x="275" y="178" font-size="15" text-anchor="middle" fill="#526477">仅保留概率最高的前 k 个候选词，其余设为 -inf</text><text x="65" y="215" font-size="15" >• 规则：固定保留 k=3 个候选，丢弃所有后续候选</text><text x="65" y="241" font-size="15" >• 优点：严格限制采样空间，实现简单高效</text><text x="65" y="267" font-size="15" >• 缺点（刚性）：无法适应不同上下文的确定性差异</text><rect x="65" y="305" width="420" height="140" rx="8" fill="white" stroke="#c8d3df" /><text x="80" y="330" font-size="15" font-weight="600">情景 1：分布平坦（多个合理词）</text><text x="80" y="355" font-size="14" fill="#526477">候选词概率：[0.30, 0.28, 0.25, 0.15, 0.02]</text><rect x="80" y="375" width="260" height="20" rx="4" fill="#dcecf9"/><text x="210" y="390" font-size="13" text-anchor="middle" font-weight="600" fill="#17639b">保留前 3 个 (共占 83%)</text><rect x="350" y="375" width="110" height="20" rx="4" fill="#fed7d7"/><text x="405" y="390" font-size="13" text-anchor="middle" font-weight="600" fill="#b32d2e">截断 (17%)</text><text x="80" y="425" font-size="13" font-weight="600" fill="#b32d2e">⚠️ 第 4 个词概率 0.15 可能合理，也会被截断。</text><rect x="65" y="460" width="420" height="140" rx="8" fill="white" stroke="#c8d3df" /><text x="80" y="485" font-size="15" font-weight="600">情景 2：分布极其集中（高确定性）</text><text x="80" y="510" font-size="14" fill="#526477">候选词概率：[0.96, 0.02, 0.015, 0.005]</text><rect x="80" y="530" width="310" height="20" rx="4" fill="#dcecf9"/><text x="235" y="545" font-size="13" text-anchor="middle" font-weight="600" fill="#17639b">强行保留 3 个候选 (共 99.5%)</text><rect x="400" y="530" width="60" height="20" rx="4" fill="#fed7d7"/><text x="430" y="545" font-size="13" text-anchor="middle" font-weight="600" fill="#b32d2e">截断</text><text x="80" y="580" font-size="13" font-weight="600" fill="#b32d2e">⚠️ 0.02、0.015 的低概率候选仍会参与采样。</text><rect x="550" y="115" width="470" height="510" rx="8" fill="#f8fafc" stroke="#c8d3df" /><text x="785" y="150" font-size="21" text-anchor="middle" font-weight="600" fill="#256846">B. Top-p 核采样（动态累积概率截断）</text><text x="785" y="178" font-size="15" text-anchor="middle" fill="#526477">按概率降序累加，保留累积和刚好达到 p 的最小集合</text><text x="575" y="215" font-size="15" >• 规则：设 p=0.90，动态自适应决定保留多少个候选词</text><text x="575" y="241" font-size="15" >• 优点：上下文确定时缩小候选池，发散时自动扩大候选池</text><text x="575" y="267" font-size="15" >• 边界：筛选依据是概率，不是候选答案的正确性</text><rect x="575" y="305" width="420" height="140" rx="8" fill="white" stroke="#c8d3df" /><text x="590" y="330" font-size="15" font-weight="600">情景 1：分布平坦（动态扩大）</text><text x="590" y="355" font-size="14" fill="#526477">累积概率：0.30 → 0.58 → 0.83 → 0.98 (&gt;0.90 停止)</text><rect x="590" y="375" width="330" height="20" rx="4" fill="#eef8f2"/><text x="755" y="390" font-size="13" text-anchor="middle" font-weight="600" fill="#256846">自适应保留前 4 个词 (累积 98%)</text><rect x="930" y="375" width="45" height="20" rx="4" fill="#fed7d7"/><text x="952" y="390" font-size="13" text-anchor="middle" font-weight="600" fill="#b32d2e">截断</text><text x="590" y="425" font-size="13" font-weight="600" fill="#256846">✅ 自动扩展到 4 个词，保留更多候选，不保证它们正确</text><rect x="575" y="460" width="420" height="140" rx="8" fill="white" stroke="#c8d3df" /><text x="590" y="485" font-size="15" font-weight="600">情景 2：分布集中（动态收缩）</text><text x="590" y="510" font-size="14" fill="#526477">累积概率：0.96 (首个词已 ≥ 0.90，立即截断)</text><rect x="590" y="530" width="280" height="20" rx="4" fill="#eef8f2"/><text x="730" y="545" font-size="13" text-anchor="middle" font-weight="600" fill="#256846">自适应仅保留第 1 个词 (96%)</text><rect x="880" y="530" width="95" height="20" rx="4" fill="#fed7d7"/><text x="927" y="545" font-size="13" text-anchor="middle" font-weight="600" fill="#b32d2e">截断尾部</text><text x="590" y="580" font-size="13" font-weight="600" fill="#256846">✅ 自动收缩为只保留 1 个词，仅此候选参与后续采样</text><text x="32" y="655" font-size="17" font-weight="600">本课组合顺序：先除以 Temperature → 再应用 Top-k 粗筛 → 再应用 Top-p 细筛 → 最后 multinomial 采样。</text><text x="32" y="685" font-size="16" fill="#526477">色带仅示意保留与截断分组，不按概率比例绘制；输出概率在保留集合内重新归一化。</text></g></svg>