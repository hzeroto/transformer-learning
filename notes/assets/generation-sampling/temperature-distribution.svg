<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="title description"><title id="title">温度调节对概率分布的影响</title><desc id="description">展示相同 logits 在 T&lt;1 尖锐化、T=1 原始分布与 T&gt;1 平坦化三种情况下的概率变化对照。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker></defs><rect width="1060" height="680" fill="white"/><g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" fill="#172b40"><text x="32" y="45" font-size="26" font-weight="600">温度参数（Temperature）对 Softmax 概率分布的调节</text><text x="32" y="80" font-size="17" fill="#526477">原始分数 logits = [4.0, 2.0, 1.0, 0.0]；对比不同 T 下除以 T 后 Softmax 的概率演变。</text><rect x="35" y="115" width="320" height="470" rx="8" fill="#f8fafc" stroke="#c8d3df" /><text x="195" y="150" font-size="18" text-anchor="middle" font-weight="600" fill="#17639b">A. 低温 T = 0.5（尖锐化）</text><text x="195" y="178" font-size="14" text-anchor="middle" fill="#526477">放大分数差异，高分概率被极度放大</text><text x="55" y="220" font-size="14" font-weight="500">token 0 (4.0)</text><rect x="55" y="230" width="215.44762324231993" height="18" rx="4" fill="#17639b"/><text x="280.44762324231993" y="244" font-size="14" font-weight="600" fill="#172b40">97.93%</text><text x="55" y="275" font-size="14" font-weight="500">token 1 (2.0)</text><rect x="55" y="285" width="3.9460608667423847" height="18" rx="4" fill="#dcecf9"/><text x="68.94606086674239" y="299" font-size="14" font-weight="600" fill="#172b40">1.79%</text><text x="55" y="330" font-size="14" font-weight="500">token 2 (1.0)</text><rect x="55" y="340" width="0.534041265069494" height="18" rx="4" fill="#f1f4f7"/><text x="65.53404126506949" y="354" font-size="14" font-weight="600" fill="#172b40">0.24%</text><text x="55" y="385" font-size="14" font-weight="500">token 3 (0.0)</text><rect x="55" y="395" width="0.07227462586821894" height="18" rx="4" fill="#f1f4f7"/><text x="65.07227462586822" y="409" font-size="14" font-weight="600" fill="#172b40">0.03%</text><rect x="55" y="510" width="280" height="50" rx="8" fill="white" stroke="#c8d3df" /><text x="195" y="541" font-size="14" text-anchor="middle" font-weight="600" fill="#17639b">更确定、保守，趋近贪心选择</text><rect x="375" y="115" width="320" height="470" rx="8" fill="#f8fafc" stroke="#c8d3df" /><text x="535" y="150" font-size="18" text-anchor="middle" font-weight="600" fill="#256846">B. 原始 T = 1.0（标准分布）</text><text x="535" y="178" font-size="14" text-anchor="middle" fill="#526477">忠实反映模型训练出的原始预测概率</text><text x="395" y="220" font-size="14" font-weight="500">token 0 (4.0)</text><rect x="395" y="230" width="182.80958531966928" height="18" rx="4" fill="#256846"/><text x="587.8095853196693" y="244" font-size="14" font-weight="600" fill="#172b40">83.10%</text><text x="395" y="275" font-size="14" font-weight="500">token 1 (2.0)</text><rect x="395" y="285" width="24.74058700760516" height="18" rx="4" fill="#eef8f2"/><text x="429.74058700760514" y="299" font-size="14" font-weight="600" fill="#172b40">11.25%</text><text x="395" y="330" font-size="14" font-weight="500">token 2 (1.0)</text><rect x="395" y="340" width="9.101553322611233" height="18" rx="4" fill="#f1f4f7"/><text x="414.1015533226112" y="354" font-size="14" font-weight="600" fill="#172b40">4.14%</text><text x="395" y="385" font-size="14" font-weight="500">token 3 (0.0)</text><rect x="395" y="395" width="3.3482743501143037" height="18" rx="4" fill="#f1f4f7"/><text x="408.3482743501143" y="409" font-size="14" font-weight="600" fill="#172b40">1.52%</text><rect x="395" y="510" width="280" height="50" rx="8" fill="white" stroke="#c8d3df" /><text x="535" y="541" font-size="14" text-anchor="middle" font-weight="600" fill="#256846">保留模型原始 Softmax 分布</text><rect x="715" y="115" width="320" height="470" rx="8" fill="#f8fafc" stroke="#c8d3df" /><text x="875" y="150" font-size="18" text-anchor="middle" font-weight="600" fill="#d96b27">C. 高温 T = 2.0（平坦化）</text><text x="875" y="178" font-size="14" text-anchor="middle" fill="#526477">缩小相对差距，低分候选获得更多机会</text><text x="735" y="220" font-size="14" font-weight="500">token 0 (4.0)</text><rect x="735" y="230" width="127.43687658710222" height="18" rx="4" fill="#d96b27"/><text x="872.4368765871022" y="244" font-size="14" font-weight="600" fill="#172b40">57.93%</text><text x="735" y="275" font-size="14" font-weight="500">token 1 (2.0)</text><rect x="735" y="285" width="46.881406943497225" height="18" rx="4" fill="#fdf3eb"/><text x="791.8814069434973" y="299" font-size="14" font-weight="600" fill="#172b40">21.31%</text><text x="735" y="330" font-size="14" font-weight="500">token 2 (1.0)</text><rect x="735" y="340" width="28.435010681695804" height="18" rx="4" fill="#f1f4f7"/><text x="773.4350106816958" y="354" font-size="14" font-weight="600" fill="#172b40">12.93%</text><text x="735" y="385" font-size="14" font-weight="500">token 3 (0.0)</text><rect x="735" y="395" width="17.246705787704737" height="18" rx="4" fill="#f1f4f7"/><text x="762.2467057877047" y="409" font-size="14" font-weight="600" fill="#172b40">7.84%</text><rect x="735" y="510" width="280" height="50" rx="8" fill="white" stroke="#c8d3df" /><text x="875" y="541" font-size="14" text-anchor="middle" font-weight="600" fill="#d96b27">随机性强、多样，效果须按任务验证</text><text x="32" y="620" font-size="17" font-weight="600">温度公式：P(x_i) = softmax(z_i / T)。唯一最大项时，T → 0 集中到该项；有限 logits 下 T → ∞ 趋向均匀。</text><text x="32" y="650" font-size="16" fill="#526477">温度改变了分布的平缓程度，但不会改变候选词之间的相对排序（保持单调性）。</text></g></svg>