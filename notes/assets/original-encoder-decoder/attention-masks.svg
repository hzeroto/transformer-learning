<text x="60" y="62" font-size="37" font-weight="700" fill="#172a43" text-anchor="start">三处 Attention 权限：行发起查询，列提供可读内容</text>
<text x="60" y="106" font-size="25" font-weight="400" fill="#53667f" text-anchor="start">固定一个样本；以下矩阵在各个 head 上使用。✓ = 允许读取，× = 屏蔽。</text>
