<text x="1168" y="798" font-size="22" font-weight="400" fill="#53667f" text-anchor="start">没有“源位置 ≤ 目标位置”的限制。</text>
<text x="1168" y="829" font-size="22" font-weight="400" fill="#53667f" text-anchor="start">两个位置轴不是同一个时间轴。</text>
<rect x="45" y="889" width="1630" height="103" rx="14" fill="#edf1f6" stroke="#cbd6e3" stroke-width="2"/>
<text x="70" y="928" font-size="25" font-weight="600" fill="#172a43" text-anchor="start">目标长度 T 可以不同于源长度 S。Cross-Attention 的三角 mask 会错误地挡住已知的源信息。</text>
<text x="70" y="968" font-size="23" font-weight="400" fill="#53667f" text-anchor="start">此例目标输入没有 PAD；若批次中有目标 PAD，目标 self-attention 还需屏蔽对应 key 列，loss 忽略 PAD 标签。</text>
</g>
