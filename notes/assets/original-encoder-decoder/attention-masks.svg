<title id="title">三处 Attention 权限：谁能读取谁</title><desc id="desc">固定一个样本。行是 query，列是 key。Encoder self-attention 的五行均为 11100；Decoder self-attention 是四乘四含对角下三角；Cross-attention 的四行均为 11100，不施加因果三角限制。</desc>
