<text x="28" y="684" font-size="18" text-anchor="start">每个 Q 框：(B, n, D)；每个 K/V 框：两份 (B, S, D)。</text>
<text x="28" y="716" font-size="18" text-anchor="start">n = 本次新 token 数，S = 追加后的缓存长度；组内共享 K/V，K 与 V 仍分别保存。</text>
<text x="28" y="747" font-size="16" text-anchor="start">缓存比例限定相同层数、B、S、D 与 dtype；不表示推理延迟也按相同比例减少。</text>
