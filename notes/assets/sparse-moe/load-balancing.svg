<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="title description"><title id="title">MoE 专家负载不均与辅助损失机制</title><desc id="description">对比展示路由塌陷导致部分专家过载与辅助平衡损失促使均匀分配的机制。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker></defs><rect width="1060" height="680" fill="white"/><g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" fill="#172b40"><text x="32" y="45" font-size="26" font-weight="600">专家负载不均衡 (Routing Collapse) 与辅助平衡损失</text><text x="32" y="80" font-size="17" fill="#526477">这里统计 Top-1 分配占比；辅助项结合硬分配占比 f 与可导的平均概率 P，鼓励均衡。</text><rect x="40" y="115" width="470" height="450" rx="8" fill="#f8fafc" stroke="#c8d3df" /><text x="275" y="150" font-size="21" text-anchor="middle" font-weight="600" fill="#b32d2e">A. 分配集中的示意（非实测）</text><text x="65" y="188" font-size="15" >• 少数专家可能在训练中长期收到更多 token</text><text x="65" y="214" font-size="15" >• 路由器将绝大多数 Token 路由到这几个专家 (如 E0, E1)</text><text x="65" y="240" font-size="15" >• 剩余专家被“饿死”，主任务训练信号较少</text><text x="65" y="266" font-size="15" >• 在分布式并行中，少数设备严重过载成为木桶短板</text><text x="65" y="305" font-size="16" font-weight="600">各专家接收的 Token 流量占比：</text><text x="70" y="345" font-size="15" font-weight="600">E0</text><rect x="105" y="330" width="221" height="22" rx="4" fill="#b32d2e"/><text x="336" y="346" font-size="15" fill="#172b40" font-weight="600">65%</text><text x="70" y="381" font-size="15" font-weight="600">E1</text><rect x="105" y="366" width="102" height="22" rx="4" fill="#d96b27"/><text x="217" y="382" font-size="15" fill="#172b40" font-weight="600">30%</text><text x="70" y="417" font-size="15" font-weight="600">E2</text><rect x="105" y="402" width="10.2" height="22" rx="4" fill="#c8d3df"/><text x="125.2" y="418" font-size="15" fill="#172b40" font-weight="600">3%</text><text x="70" y="453" font-size="15" font-weight="600">E3</text><rect x="105" y="438" width="6.8" height="22" rx="4" fill="#c8d3df"/><text x="121.8" y="454" font-size="15" fill="#172b40" font-weight="600">2%</text><text x="275" y="530" font-size="16" text-anchor="middle" fill="#b32d2e" font-weight="600">⚠️ 负载不均；不能仅凭此图推断实际延迟</text><rect x="550" y="115" width="470" height="450" rx="8" fill="#f8fafc" stroke="#c8d3df" /><text x="785" y="150" font-size="21" text-anchor="middle" font-weight="600" fill="#256846">B. 较均衡的示意（非保证结果）</text><text x="575" y="188" font-size="15" >• 统计批次内各专家的调度频率 f_e 与平均门控权重 P_e</text><text x="575" y="214" font-size="15" >• 构造负载均衡辅助损失：L_aux = α · E · Σ (f_e · P_e)</text><text x="575" y="240" font-size="15" >• f_e = P_e = 1/E 时值为 α，不是一般严格下界</text><text x="575" y="266" font-size="15" >• 梯度经过 P 调整路由参数，实际分配仍需检查</text><text x="575" y="305" font-size="16" font-weight="600">各专家接收的 Token 流量占比：</text><text x="580" y="345" font-size="15" font-weight="600">E0</text><rect x="615" y="330" width="88.4" height="22" rx="4" fill="#256846"/><text x="713.4" y="346" font-size="15" fill="#172b40" font-weight="600">26%</text><text x="580" y="381" font-size="15" font-weight="600">E1</text><rect x="615" y="366" width="81.6" height="22" rx="4" fill="#256846"/><text x="706.6" y="382" font-size="15" fill="#172b40" font-weight="600">24%</text><text x="580" y="417" font-size="15" font-weight="600">E2</text><rect x="615" y="402" width="85" height="22" rx="4" fill="#256846"/><text x="710" y="418" font-size="15" fill="#172b40" font-weight="600">25%</text><text x="580" y="453" font-size="15" font-weight="600">E3</text><rect x="615" y="438" width="85" height="22" rx="4" fill="#256846"/><text x="710" y="454" font-size="15" fill="#172b40" font-weight="600">25%</text><text x="785" y="530" font-size="16" text-anchor="middle" fill="#256846" font-weight="600">✅ 各专家接收量接近；效果和速度另行验证</text><text x="32" y="615" font-size="18" font-weight="600">关键总结：MoE 的核心收益是“用总参数量换容量，用激活参数量控算力”。</text><text x="32" y="645" font-size="17" fill="#526477">辅助项只鼓励均衡；是否有效需检查实际负载，不能单靠损失值判断训练与性能。</text></g></svg>