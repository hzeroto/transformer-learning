<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="840" viewBox="0 0 1060 840" role="img" aria-labelledby="title description"><title id="title">MoE 稀疏路由与前馈专家数据流</title><desc id="description">展示单个 token 从输入、路由器打分、Top-k 门控权重计算、稀疏分发至选定专家、到最终加权求和的完整前向数据流。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker></defs><rect width="1060" height="840" fill="white"/><g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" fill="#172b40"><text x="32" y="45" font-size="26" font-weight="600">MoE 稀疏路由与专家前馈：单 Token 的计算数据流</text><text x="32" y="80" font-size="17" fill="#526477">固定一个位置输入 x : (C,)，专家总数 E = 4，激活专家数 Top-k = 2；展示路由权重与加权组合。</text><rect x="380" y="110" width="300" height="52" rx="8" fill="#dcecf9" stroke="#17639b" /><text x="530" y="142" font-size="19" text-anchor="middle" font-weight="600" fill="#17639b">Token 输入向量 x : (C,)</text><path d="M450 162 V210 H220 V240" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><path d="M610 162 V210 H840 V240" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="240" width="340" height="290" rx="8" fill="#f8fafc" stroke="#c8d3df" /><text x="220" y="272" font-size="20" text-anchor="middle" font-weight="600">① 路由器门控网络 (Router)</text><rect x="70" y="295" width="300" height="44" rx="8" fill="white" stroke="#c8d3df" /><text x="220" y="323" font-size="16" text-anchor="middle">原始打分 logits = x @ W_gate  (E=4)</text><path d="M220 339 V365" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="365" width="300" height="44" rx="8" fill="white" stroke="#c8d3df" /><text x="220" y="393" font-size="16" text-anchor="middle">Top-k 筛选：取前 k=2 大的分数与索引</text><path d="M220 409 V435" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="435" width="300" height="68" rx="8" fill="#fdf3eb" stroke="#d96b27" /><text x="220" y="462" font-size="16" text-anchor="middle" font-weight="500">在 Top-k 候选上重新 Softmax：</text><text x="220" y="486" font-size="16" text-anchor="middle" font-weight="500">w₁ = 0.70 (专家 0),  w₂ = 0.30 (专家 2)</text><rect x="430" y="240" width="580" height="290" rx="8" fill="#f8fafc" stroke="#c8d3df" /><text x="720" y="272" font-size="20" text-anchor="middle" font-weight="600">② 专家网络池 (E=4 个独立的 FFN)</text><rect x="450" y="300" width="260" height="75" rx="8" fill="#eef8f2" stroke="#256846" /><text x="580" y="330" font-size="17" text-anchor="middle" font-weight="600" fill="#256846">Expert 0 (激活)</text><text x="580" y="356" font-size="15" text-anchor="middle" fill="#172b40">计算 y₀ = FFN₀(x)</text><rect x="730" y="300" width="260" height="75" rx="8" fill="#f8f8f8" stroke="#d0d0d0" /><text x="860" y="330" font-size="17" text-anchor="middle" font-weight="600" fill="#526477">Expert 1 (跳过)</text><text x="860" y="356" font-size="15" text-anchor="middle" fill="#526477">本 token 跳过此 FFN</text><rect x="450" y="395" width="260" height="75" rx="8" fill="#eef8f2" stroke="#256846" /><text x="580" y="425" font-size="17" text-anchor="middle" font-weight="600" fill="#256846">Expert 2 (激活)</text><text x="580" y="451" font-size="15" text-anchor="middle" fill="#172b40">计算 y₂ = FFN₂(x)</text><rect x="730" y="395" width="260" height="75" rx="8" fill="#f8f8f8" stroke="#d0d0d0" /><text x="860" y="425" font-size="17" text-anchor="middle" font-weight="600" fill="#526477">Expert 3 (跳过)</text><text x="860" y="451" font-size="15" text-anchor="middle" fill="#526477">本 token 跳过此 FFN</text><path d="M220 530 V600 H480 V635" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 337 H720 V565 H540 V635" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 470 V580 H570 V635" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="635" width="500" height="95" rx="8" fill="#fdfaf6" stroke="#d96b27" /><text x="530" y="668" font-size="19" text-anchor="middle" font-weight="600" fill="#d96b27">③ 门控加权聚合 (Weighted Combination)</text><text x="530" y="702" font-size="17" text-anchor="middle" font-weight="500">y = w₁ · y₀ + w₂ · y₂ = 0.70 · FFN₀(x) + 0.30 · FFN₂(x)</text><path d="M530 730 V775" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="775" width="300" height="48" rx="8" fill="#dcecf9" stroke="#17639b" /><text x="530" y="805" font-size="18" text-anchor="middle" font-weight="600" fill="#17639b">MoE 层输出 y : (C,)</text></g></svg>