<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="800" viewBox="0 0 1140 800" role="img" aria-labelledby="title desc">
<title id="title">同一模型的 Prefill 与单 token Decode：score 矩形的变化</title>
<desc id="desc">B=2,Hq=6,Hkv=2,D=4,C=24。左侧空缓存一次输入7个位置，单头score是7乘7矩阵，下三角28格允许读取，上三角21格被mask，全部49格都经过稠密矩阵乘法。完整score shape为2,6,7,7，共588个元素。右侧已有7个位置再输入1个位置，单头score是1乘8矩阵，8格都允许读取。完整score shape为2,6,1,8，共96个元素。K与V每层各以2,S,8紧凑存储。投影和FFN只作用于新增位置；Decode仍读取旧KV。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#182b45} .title{font-size:27px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:18px}.strong{font-weight:700}.muted{fill:#4b6079}.mono{font-family:Consolas,"Microsoft YaHei",monospace}</style>
<rect width="1140" height="800" fill="#f7f9fd"/>
<text x="40" y="43" class="title" >同一模型：新 query 变少，历史 key 仍需读取</text>
<text x="40" y="78" class="body muted" >B=2，Hq=6，Hkv=2，D=4，C=24  ·  网格固定一个 batch 和一个 Q 头</text>
