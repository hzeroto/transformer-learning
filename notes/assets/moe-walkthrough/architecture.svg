<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1060" viewBox="0 0 1120 1060" role="img">
<title>MoE 在完整因果语言模型中的位置</title><desc>左：TinyMoELM 的完整数据流；右：放大一个 MoETransformerBlock。默认共 2 层。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#73869a"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#182e42">
<text x="35" y="43" font-size="28" font-weight="600" text-anchor="start" fill="#182e42">MoE 在完整因果语言模型中的位置</text>
<text x="35" y="79" font-size="19" font-weight="400" text-anchor="start" fill="#516579">左：TinyMoELM 的完整数据流；右：放大一个 MoETransformerBlock。默认共 2 层。</text>
<text x="195" y="130" font-size="20" font-weight="600" text-anchor="middle" fill="#182e42">完整模型</text>
<rect x="35" y="155" width="325" height="65" rx="10" fill="#e8f1fa" stroke="#c6d3de"/>
<text x="197.5" y="194.5" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">input_ids  (B,T)</text>
<rect x="35" y="255" width="325" height="75" rx="10" fill="#e8f1fa" stroke="#c6d3de"/>
<text x="197.5" y="285.0" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">token embedding + position</text>
<text x="197.5" y="314.0" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">(B,T,C)</text>
<rect x="35" y="370" width="325" height="65" rx="10" fill="#fff0df" stroke="#c6d3de"/>
<text x="197.5" y="409.5" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">MoETransformerBlock 0</text>
<rect x="35" y="480" width="325" height="65" rx="10" fill="#fff0df" stroke="#c6d3de"/>
<text x="197.5" y="519.5" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">MoETransformerBlock 1</text>
<rect x="35" y="590" width="325" height="60" rx="10" fill="#e8f1fa" stroke="#c6d3de"/>
<text x="197.5" y="627.0" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">final LayerNorm</text>
<rect x="35" y="695" width="325" height="70" rx="10" fill="#e8f1fa" stroke="#c6d3de"/>
<text x="197.5" y="722.5" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">@ W_vocab  (C,V)</text>
<text x="197.5" y="751.5" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">输出词表分数</text>
<rect x="35" y="810" width="325" height="65" rx="10" fill="#e8f1fa" stroke="#c6d3de"/>
<text x="197.5" y="849.5" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">logits  (B,T,V)</text>
<rect x="35" y="920" width="325" height="65" rx="10" fill="#e8f1fa" stroke="#c6d3de"/>
<text x="197.5" y="945.0" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">下一 token 标签 → 交叉熵</text>
<text x="197.5" y="974.0" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">L_task</text>
<polyline points="197,220 197,255" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="197,330 197,370" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="197,435 197,480" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="197,545 197,590" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="197,650 197,695" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="197,765 197,810" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="197,875 197,920" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="197" y="1025" font-size="18" font-weight="400" text-anchor="middle" fill="#516579">V = 词表大小；C = 隐藏宽度</text>
<rect x="465" y="155" width="620" height="735" rx="10" fill="#f7f9fc" stroke="#c6d3de"/>
<text x="775" y="194" font-size="20" font-weight="600" text-anchor="middle" fill="#182e42">块内部：MoE 接替原 FFN 的位置</text>
<rect x="650" y="225" width="260" height="55" rx="10" fill="#e8f1fa" stroke="#c6d3de"/>
<text x="780.0" y="259.5" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">块输入 x  (B,T,C)</text>
<rect x="620" y="330" width="320" height="75" rx="10" fill="#e8f1fa" stroke="#c6d3de"/>
<text x="780.0" y="360.0" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">norm1 → CausalSelfAttention</text>
<text x="780.0" y="389.0" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">每个 token 仍执行所有头</text>
<polyline points="780,280 780,330" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="780" cy="453" r="22" fill="white" stroke="#73869a" stroke-width="2"/>
<text x="780" y="460" font-size="27" font-weight="400" text-anchor="middle" fill="#182e42">+</text>
<polyline points="780,405 780,431" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="650,252 530,252 530,453 758,453" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="538" y="350" font-size="18" font-weight="400" text-anchor="start" fill="#516579">残差 x</text>
<text x="818" y="460" font-size="18" font-weight="400" text-anchor="start" fill="#182e42">h  (B,T,C)</text>
<rect x="650" y="510" width="260" height="65" rx="10" fill="#e8f1fa" stroke="#c6d3de"/>
<text x="780.0" y="535.0" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">z = norm2(h)</text>
<text x="780.0" y="564.0" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">(B,T,C)</text>
<polyline points="780,475 780,510" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="625" width="260" height="65" rx="10" fill="#fff0df" stroke="#c6d3de"/>
<text x="780.0" y="650.0" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">SparseMoE(z)</text>
<text x="780.0" y="679.0" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">delta  (B,T,C)</text>
<polyline points="780,575 780,625" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="780" cy="751" r="22" fill="white" stroke="#73869a" stroke-width="2"/>
<text x="780" y="758" font-size="27" font-weight="400" text-anchor="middle" fill="#182e42">+</text>
<polyline points="780,690 780,729" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="780,485 585,485 585,751 758,751" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="591" y="619" font-size="18" font-weight="400" text-anchor="start" fill="#516579">残差 h</text>
<rect x="650" y="810" width="260" height="55" rx="10" fill="#e8f1fa" stroke="#c6d3de"/>
<text x="780.0" y="844.5" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">块输出 h + delta  (B,T,C)</text>
<polyline points="780,773 780,810" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="360,403 425,403 425,194 465,194" fill="none" stroke="#73869a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="428" y="360" font-size="18" font-weight="400" text-anchor="start" fill="#516579">放大</text>
<rect x="485" y="932" width="590" height="65" rx="10" fill="#e9f5ee" stroke="#c6d3de"/>
<text x="780.0" y="957.0" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">每层 L_balance 取平均后，乘 alpha</text>
<text x="780.0" y="986.0" font-size="20" font-weight="400" text-anchor="middle" fill="#182e42">L_total = L_task + alpha × mean(L_balance)</text>
<polyline points="910,658 1050,658 1050,932" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1040" y="916" font-size="18" font-weight="400" text-anchor="end" fill="#516579">路由辅助项</text>
<polyline points="360,953 485,953" fill="none" stroke="#73869a" stroke-width="2" marker-end="url(#arrow)"/>
</g></svg>
